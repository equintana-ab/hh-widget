<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promo Block</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        font-family: "Poppins", Helvetica, Arial, sans-serif;
      }

      .content-column-demo {
        background: #fff;
        padding: 0 16px;
      }

      /* =========================================================
         PROMO BLOCK
         ========================================================= */
      .hh-promo-block {
        --hh-blue: #07499d;
        --hh-orange: #ec8c00;
      }

      /* ---- Header ---- */
      .hh-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
        text-align: center;
        padding: 14px 0 14px 14px;
        background: #fff;
      }
      .hh-header__title {
        font-weight: 700;
        font-size: clamp(24px, 3vw, 34px);
        line-height: 1.2;
        display: flex;
        flex-direction: column;
      }
      .hh-header__title span:first-child {
        color: var(--hh-blue);
        transform: rotate(-1.302deg);
      }
      .hh-header__title span:last-child {
        color: var(--hh-orange);
      }
      .hh-header__copy {
        font-size: clamp(14px, 2vw, 20px);
        line-height: 1.3;
        color: var(--hh-blue);
        font-weight: 600;
        max-width: 400px;
        text-align: start;
      }
      @media (min-width: 480px) {
        .hh-header {
          gap: 14px;
        }
      }

      /* ---- Full-bleed breakout slider ----
         Standard breakout used across Magento CMS blocks so the row can be
         wider than the constrained content column it sits in. */
      .hh-slider {
        position: relative;
        left: 50%;
        width: 100vw;
        transform: translateX(-50%);
      }

      /* This is the actual scroll container — it MUST wrap the cards.
         Without it there's no overflow-x/snap context to scroll at all. */
      .hh-slider__track {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px 12px;
        scrollbar-width: none;
        -ms-overflow-style: none;
        cursor: grab;
        touch-action: pan-y;
      }
      .hh-slider__track::-webkit-scrollbar {
        display: none;
      }
      .hh-slider__track.is-dragging {
        cursor: grabbing;
        scroll-snap-type: none;
      }

      /* Image cards — same sizing role the placeholder .hh-card divs had.
         Sizing/snap now lives on the anchor; the img just fills it. */
      .hh-card__link {
        flex: 0 0 auto;
        display: block;
        width: 78vw; /* peek the next card on mobile */
        overflow: hidden;
        scroll-snap-align: start;
        -webkit-user-drag: none;
        user-select: none;
      }
      .hh-card__img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: none; /* let the track/anchor handle drag+click, not the image */
      }

      @media (min-width: 480px) {
        .hh-card__link {
          width: 300px;
        }
      }
      @media (min-width: 900px) {
        .hh-card__link {
          width: 80%;
        }
        .hh-slider__track {
          gap: 19px;
        }
      }
    </style>
  </head>
  <body>
    <div class="content-column-demo">
      <div class="hh-promo-block" data-hh-promo>
        <div class="hh-header">
          <p class="hh-header__title"><span>Happier</span> <span>Holidays</span></p>
          <p class="hh-header__copy">Get up to 35% off when you use the following payment methods!</p>
        </div>

        <div class="hh-slider">
          <div class="hh-slider__track" data-hh-track>
            <a class="hh-card__link" href="/pre-order" aria-label="Pre-Order with a Personal Shopper">
              <img class="hh-card__img" src="./assets/banner-image.jpg" alt="Abenson Banner" />
            </a>
            <a class="hh-card__link" href="/pa-deliver" aria-label="Pa-Deliver Next-Day and Same-Day">
              <img class="hh-card__img" src="./assets/banner-image-2.jpg" alt="Abenson Banner" />
            </a>
            <a class="hh-card__link" href="/viber" aria-label="Chat with abenson on Viber">
              <img class="hh-card__img" src="./assets/banner-image-3.jpg" alt="Abenson Banner" />
            </a>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* SPA-safe init: IIFE + guard flag + data-bound attribute + MutationObserver,
         so this survives client-side route changes in the Siminia PWA shell. */
      (function () {
        if (window.__hhPromoInit) return;
        window.__hhPromoInit = true;

        function bindTrack(track) {
          if (!track || track.dataset.hhBound) return;
          track.dataset.hhBound = "true";

          let isDown = false;
          let startX = 0;
          let scrollLeft = 0;
          let dragDistance = 0;
          const DRAG_THRESHOLD = 6; // px of mouse movement before a "click" counts as a drag

          const start = (x) => {
            isDown = true;
            dragDistance = 0;
            track.classList.add("is-dragging");
            startX = x - track.offsetLeft;
            scrollLeft = track.scrollLeft;
          };
          const move = (x, e) => {
            if (!isDown) return;
            e.preventDefault();
            const walk = x - track.offsetLeft - startX;
            dragDistance = Math.max(dragDistance, Math.abs(walk));
            track.scrollLeft = scrollLeft - walk;
          };
          const end = () => {
            isDown = false;
            track.classList.remove("is-dragging");
          };

          // Mouse (trackpad/desktop) drag support — touch works natively via overflow-x
          track.addEventListener("mousedown", (e) => start(e.pageX));
          track.addEventListener("mousemove", (e) => move(e.pageX, e));
          track.addEventListener("mouseup", end);
          track.addEventListener("mouseleave", end);

          // A dragged swipe shouldn't fire the card's link navigation —
          // only suppress the click when the mouse actually moved past the threshold.
          track.querySelectorAll(".hh-card__link").forEach((link) => {
            link.addEventListener("click", (e) => {
              if (dragDistance > DRAG_THRESHOLD) {
                e.preventDefault();
              }
            });
          });
        }

        function init(root) {
          (root || document).querySelectorAll("[data-hh-track]").forEach(bindTrack);
        }

        document.addEventListener("DOMContentLoaded", () => init());
        init(); // in case DOMContentLoaded already fired (SPA route swap)

        // Re-bind if the block gets re-rendered by client-side navigation
        new MutationObserver((mutations) => {
          mutations.forEach((m) => {
            m.addedNodes.forEach((node) => {
              if (node.nodeType !== 1) return;
              if (node.matches && node.matches("[data-hh-promo]")) init(node);
              else if (node.querySelector) init(node);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
