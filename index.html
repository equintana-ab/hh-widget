<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Promo Block</title>
    <style>
      /* ---- host-page reset for the demo only ---- */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f2f2f2;
        overflow-x: clip; /* modern browsers */
        overflow-x: hidden; /* fallback for older browsers */
      }

      .content-column-demo {
        max-width: 700px;
        margin: 24px auto;
        background: #fff;
        padding: 0 16px;
      }

      /* =========================================================
   PROMO BLOCK
     ========================================================= */
      .hh-promo-block {
        --hh-blue: #0b3d91;
        --hh-orange: #f7941d;
      }

      /* ---- Header ---- */
      .hh-header {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
        text-align: center;
        padding: 14px 16px;
        background: #fff;
      }
      .hh-header__title {
        font-weight: 800;
        font-size: 15px;
        line-height: 1.2;
        white-space: nowrap;
      }
      .hh-header__title span:first-child {
        color: var(--hh-blue);
      }
      .hh-header__title span:last-child {
        color: var(--hh-orange);
      }
      .hh-header__copy {
        font-size: 12px;
        line-height: 1.3;
        color: var(--hh-blue);
        font-weight: 600;
        max-width: 240px;
      }
      @media (min-width: 480px) {
        .hh-header {
          gap: 10px;
        }
        .hh-header__title {
          font-size: 18px;
        }
        .hh-header__copy {
          font-size: 13px;
          max-width: none;
        }
      }

      /* ---- Full-bleed breakout slider ----
     Standard breakout used across Magento CMS blocks so the row can be
     wider than the constrained content column it sits in. */
      .hh-slider {
        position: relative;
        left: 50%;
        width: 100vw;
        transform: translateX(-50%);
      }
      .hh-slider__track {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        padding: 0 16px 12px;
        /* hide scrollbar, no arrows/controls at all */
        scrollbar-width: none;
        -ms-overflow-style: none;
        cursor: grab;
      }
      .hh-slider__track::-webkit-scrollbar {
        display: none;
      }
      .hh-slider__track.is-dragging {
        cursor: grabbing;
        scroll-snap-type: none;
      }

      .hh-card {
        position: relative;
        flex: 0 0 auto;
        width: 78vw; /* peek the next card on mobile */
        max-width: 340px;
        aspect-ratio: 16 / 9;
        border-radius: 10px;
        overflow: hidden;
        scroll-snap-align: start;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 16px 18px;
        background: linear-gradient(135deg, #1e6fe0 0%, #0b3d91 100%);
        user-select: none;
        -webkit-user-select: none;
      }
      .hh-card img {
        -webkit-user-drag: none;
        pointer-events: none;
      }
      .hh-card--pa-deliver {
        background: linear-gradient(135deg, #2f8bf5 0%, #0b3d91 100%);
      }
      .hh-card--viber {
        background: linear-gradient(135deg, #0b3d91 0%, #071f4d 100%);
      }

      .hh-card__logo {
        font-weight: 800;
        font-size: 20px;
        margin: 0 0 8px;
      }
      .hh-card__title {
        font-weight: 800;
        font-size: 20px;
        line-height: 1.1;
        text-transform: uppercase;
        margin: 0;
      }
      .hh-card__subtitle {
        font-size: 12px;
        font-weight: 600;
        margin: 4px 0 0;
        opacity: 0.95;
      }
      .hh-card__badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 20px;
        font-size: 10px;
        font-weight: 700;
        padding: 4px 10px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      @media (min-width: 480px) {
        .hh-card {
          width: 300px;
          padding: 20px 22px;
        }
      }
      @media (min-width: 900px) {
        .hh-card {
          width: 320px;
        }
      }
    </style>
  </head>
  <body>
    <div class="content-column-demo">
      <div class="hh-promo-block" data-hh-promo>
        <div class="hh-header">
          <p class="hh-header__title"><span>Happier</span> <span>Holidays</span></p>
          <p class="hh-header__copy">Get up to 35% off when you use the following payment methods!</p>
        </div>

        <div class="hh-slider">
          <div class="hh-slider__track" data-hh-track>
            <div class="hh-card hh-card--preorder">
              <p class="hh-card__logo">abenson</p>
              <p class="hh-card__title">Pre-Order</p>
              <p class="hh-card__subtitle">with a Personal Shopper</p>
            </div>

            <div class="hh-card hh-card--pa-deliver">
              <span class="hh-card__badge">Pa-Deliver</span>
              <p class="hh-card__title">Pa-Deliver</p>
              <p class="hh-card__subtitle">Next-Day and Same-Day</p>
            </div>

            <div class="hh-card hh-card--viber">
              <span class="hh-card__badge">Viber</span>
              <p class="hh-card__title">abenson</p>
              <p class="hh-card__subtitle">Viber Official Account — Chat lang!</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      /* SPA-safe init: IIFE + guard flag + data-bound attribute + MutationObserver,
   so this survives client-side route changes in the Siminia PWA shell. */
      (function () {
        if (window.__hhPromoInit) return;
        window.__hhPromoInit = true;

        function bindTrack(track) {
          if (!track || track.dataset.hhBound) return;
          track.dataset.hhBound = "true";

          let isDown = false;
          let startX = 0;
          let scrollLeft = 0;

          const start = (x) => {
            isDown = true;
            track.classList.add("is-dragging");
            startX = x - track.offsetLeft;
            scrollLeft = track.scrollLeft;
          };
          const move = (x, e) => {
            if (!isDown) return;
            e.preventDefault();
            const walk = x - track.offsetLeft - startX;
            track.scrollLeft = scrollLeft - walk;
          };
          const end = () => {
            isDown = false;
            track.classList.remove("is-dragging");
          };

          // Mouse (trackpad/desktop) drag support — touch works natively via overflow-x
          track.addEventListener("mousedown", (e) => start(e.pageX));
          track.addEventListener("mousemove", (e) => move(e.pageX, e));
          track.addEventListener("mouseup", end);
          track.addEventListener("mouseleave", end);
        }

        function init(root) {
          (root || document).querySelectorAll("[data-hh-track]").forEach(bindTrack);
        }

        document.addEventListener("DOMContentLoaded", () => init());
        init(); // in case DOMContentLoaded already fired (SPA route swap)

        // Re-bind if the block gets re-rendered by client-side navigation
        new MutationObserver((mutations) => {
          mutations.forEach((m) => {
            m.addedNodes.forEach((node) => {
              if (node.nodeType !== 1) return;
              if (node.matches && node.matches("[data-hh-promo]")) init(node);
              else if (node.querySelector) init(node);
            });
          });
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
